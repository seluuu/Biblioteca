<section>
	<span class="eyebrow">Catálogo</span>
	<h1>Libros para cada momento.</h1>
	<p>Explora novelas, ensayos y relatos seleccionados para alimentar la curiosidad.</p>
	<nav class="genre-menu" aria-label="Filtrar por género">
		<a routerLink="/libros">Todos</a>
		<a routerLink="/libros" [queryParams]="{ genero: 'novela' }">Novela</a>
		<a routerLink="/libros" [queryParams]="{ genero: 'ensayo' }">Ensayo</a>
		<a routerLink="/libros" [queryParams]="{ genero: 'relato' }">Relato</a>
	</nav>
	<div class="content-grid">
		@for (libro of libros; track libro.id) {
			<a class="content-card book-card" [routerLink]="['/libros', libro.id]">
				<span class="book-genre">{{ libro.genero }}</span>
				<h2>{{ libro.titulo }}</h2>
				<p>{{ libro.autor }}</p>
			</a>
		} @empty {
			<p class="empty-state">No hay libros para este género.</p>
		}
	</div>
</section>
